name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler
        run: |
          xcodebuild \
            -project ClashElixir.xcodeproj \
            -scheme ClashElixir \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaqueter en .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ClashElixir.app Payload/
          zip -qry ClashElixir.ipa Payload

      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClashElixir-ipa
          path: ClashElixir.ipa
