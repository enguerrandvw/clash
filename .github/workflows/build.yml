name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Cloner le dépôt de sons
        run: |
          git clone --depth 1 \
            https://github.com/Benantana/Clash-Royale-Sound-Effects.git /tmp/sfx
          echo "Taille :"; du -sh /tmp/sfx

      - name: Installer numpy
        run: pip3 install --quiet --break-system-packages numpy || pip3 install --quiet numpy

      - name: Calculer les empreintes de référence
        run: |
          python3 Tools/make_refs.py /tmp/sfx App/SoundRefs.swift
          grep -c "SoundRef(card:" App/SoundRefs.swift

      - name: Entraîner le classificateur de sons
        run: |
          python3 Tools/train_sound_model.py /tmp/sfx App/SoundModel.swift
          echo "--- taille du modèle ---"
          wc -c App/SoundModel.swift

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler
        run: |
          xcodebuild \
            -project ClashElixir.xcodeproj \
            -scheme ClashElixir \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaqueter en .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ClashElixir.app Payload/
          zip -qry ClashElixir.ipa Payload

      - name: Publier en Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ClashElixir.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
